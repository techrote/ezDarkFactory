name: EDF provenance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  provenance:
    name: Provenance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Checkout literal PR head or merged main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2; same reviewed pin as baseline
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up provenance test Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12.10'
      - name: Authenticate source and run complete EDF-001 gate
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python tools/check.py --fetch --sources "$RUNNER_TEMP/edf-provenance-sources"
